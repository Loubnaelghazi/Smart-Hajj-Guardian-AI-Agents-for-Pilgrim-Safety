services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-hajj-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://guardian:guardian_dev_password@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: smart_hajj_guardian
      NOKIA_API_KEY: ${NOKIA_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  mongodb:
    image: mongo:8
    container_name: smart-hajj-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: guardian
      MONGO_INITDB_ROOT_PASSWORD: guardian_dev_password
      MONGO_INITDB_DATABASE: smart_hajj_guardian
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "guardian",
          "--password",
          "guardian_dev_password",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: smart-hajj-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://guardian:guardian_dev_password@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: guardian_admin
    ports:
      - "8081:8081"

volumes:
  mongodb_data:
